[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-local"
version = "0.1.0"
description = "RAG local con Elasticsearch como almacén vectorial y Ollama para embeddings y respuestas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Graciano" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "elasticsearch>=8.12,<9", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
